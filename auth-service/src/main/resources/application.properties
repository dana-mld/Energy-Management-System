###############################################
### ENV FILE USE ###
###############################################
spring.config.import=optional:file:.env[.properties]


###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
database.ip = ${DB_HOST:localhost}
database.port = ${DB_PORT:3306}
database.user = ${DB_USER:user}
database.password = ${DB_PASSWORD:user}
database.name = ${DB_NAME:db}

spring.datasource.url = jdbc:mysql://${database.ip}:${database.port}/${database.name}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}


###############################################
### JPA / HIBERNATE ###
###############################################
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=error
logging.level.org.springframework=error
logging.level.ro.tuc=error


###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8081}
user-service.url=${USER_SERVICE_URL:http://localhost:8080}
spring.application.name=auth-service





jwt.secret=${JWT_SECRET}
jwt.issuer=auth-service
jwt.expiration-minutes=60

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost}


# OpenAPI
springdoc.api-docs.path=/docs/auth/openapi

# Swagger UI
springdoc.swagger-ui.path=/docs/auth/swagger-ui.html

springdoc.paths-to-match=/auth/login,/auth/logout,/auth/me

springdoc.swagger-ui.disable-swagger-default-url=true