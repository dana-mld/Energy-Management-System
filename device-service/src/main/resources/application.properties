###############################################
### ENV FILE USE ###
###############################################
spring.config.import=optional:file:.env[.properties]


###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
database.ip = ${DB_HOST:localhost}
database.port = ${DB_PORT:3306}
database.user = ${DB_USER:user}
database.password = ${DB_PASSWORD:user}
database.name = ${DB_NAME:db}

spring.datasource.url = jdbc:mysql://${database.ip}:${database.port}/${database.name}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}


###############################################
### JPA / HIBERNATE ###
###############################################
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=error
logging.level.org.springframework=error
logging.level.ro.tuc=error


###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8080}
user-service.url=${USER_SERVICE_URL:http://localhost:8080}

springdoc.api-docs.path=/docs/devices/openapi
springdoc.swagger-ui.path=/docs/devices/swagger-ui.html
springdoc.paths-to-match=/devices,/devices/**
springdoc.swagger-ui.disable-swagger-default-url=true